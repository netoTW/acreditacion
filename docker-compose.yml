# Arranque de un solo comando (CLAUDE.md §11):
#     cp .env.example .env && docker compose up
#
# Espera dependencias → migra → carga el seed → sirve. Sin pasos manuales.
# Todo local, costo cero. La nube es tema de producción, post-firma.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PUERTO_DB:-5432}:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      # Contexto en la raíz: la imagen necesita docs/contenido/, que es el
      # contrato del Generador y tiene una sola fuente de verdad.
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUERTO_API: ${PUERTO_API:-8010}          # solo para que el log muestre la URL correcta
      MODO_DEV: ${MODO_DEV:-true}              # login "actuar como" + clave de respuestas del contenido de prueba
      SECRETO_SESION: ${SECRETO_SESION:-dev-inseguro-cambiar-en-produccion}
      ORIGENES_PERMITIDOS: ${ORIGENES_PERMITIDOS:-}
    ports:
      - "${PUERTO_API:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy      # no arranca antes de que la base esté sana
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/salud')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  realtime:
    build: ./realtime
    environment:
      PUERTO: 2567
    ports:
      - "${PUERTO_REALTIME:-2567}:2567"
    healthcheck:
      # 127.0.0.1 y no localhost: en Alpine, localhost resuelve primero a ::1 y el
      # servidor escucha en IPv4 (0.0.0.0), así que el healthcheck daba "connection refused".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2567/salud || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API: http://localhost:${PUERTO_API:-8010}
    ports:
      - "${PUERTO_WEB:-5180}:5180"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5180/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  datos_db:
