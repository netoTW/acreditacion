# El frontend y la API se sirven desde el MISMO ORIGEN.
#
# Antes el navegador llamaba a http://localhost:8010 —una URL horneada en el
# build— y eso obligaba a configurar CORS y se rompía apenas la página se abría
# desde otra dirección: exactamente el bug que apareció al contenedorizar la web
# y el que volvería a aparecer al publicar por un túnel.
#
# Con el proxy no hay llamada cross-origin: no hay preflight, no hay CORS que
# configurar y la misma imagen funciona en localhost, en la red local y detrás de
# ngrok sin recompilar nada.
server {
    listen 5180;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aplicación de una sola página: toda ruta desconocida cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/... → la API, sin el prefijo. La barra final de proxy_pass es la que
    # lo quita: /api/salud llega como /salud.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
